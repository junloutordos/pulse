[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "geopandas",
  "shapely",
  "duckdb",
  "pandera",
  "libpysal",
  "esda",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
